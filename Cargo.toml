[package]
name = "llm-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Local Claude Code to Codex proxy with multiple ChatGPT accounts"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hmac = "0.13"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "stream", "rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "sync", "io-util"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
