# Copy to $XDG_STATE_HOME/llm-proxy/config.toml (normally ~/.local/state/llm-proxy).
# Choose a model your ChatGPT account can access. This catalog is not an entitlement check.
default_provider = "codex"
default_model = "gpt-6.1-sol"
# Keep loopback on the host; Docker explicitly overrides this inside the container.
listen_address = "127.0.0.1"
listen_port = 18765
# Metadata only; no prompts, tool arguments or credentials.
log_level = "info"
# Usage/reset API base; independent of the inference Responses endpoint.
# codex_account_endpoint = "https://chatgpt.com/backend-api"
# Native Antigravity outbound (Google OAuth; no Node sidecar).
# OAuth client credentials belong in the proxy process environment, never TOML:
# LLM_PROXY_AGY_CLIENT_ID and LLM_PROXY_AGY_CLIENT_SECRET (also required for refresh).
# agy_endpoint = "https://daily-cloudcode-pa.googleapis.com"
# Local output policy, not provider entitlement/limits; thinking budget must be lower.
# agy_max_output_tokens = 40960
# agy_thinking_budget = 32000
# AGY accepts omitted reasoning effort only: explicit output_config.effort or
# reasoning_effort returns unsupported_reasoning_effort before dispatch. This
# budget is the omitted-effort policy for Claude -thinking, not an effort mapping.
# To use AGY as the default, set default_provider = "agy" and
# default_model = "claude-sonnet-4-6" above; set [auto_review] provider = "codex"
# and keep its Codex model below (requires a Codex account). AGY structured-output
# classifiers are unsupported and fail closed.

# Client classifier: provider inherits default_provider; model defaults to Luna.
# CLAUDE_CODE_AUTO_MODE_SERVER=0 belongs on Claude Code, not the proxy process.
[auto_review]
# provider = "codex"
model = "gpt-6-luna"
# model = "sonnet" # Explicitly follow the main default model instead.

# Unmapped Claude aliases use default_model. Explicitly registered native Claude
# model IDs win over this fallback. Override individual aliases here.
[aliases]
# sonnet = "claude-sonnet-4-6" # Also register the AGY model policy shown below.
# haiku = "gpt-6-luna"
# sonnet = "gpt-6.1-sol"
# opus = "gpt-6-astra"

# gpt-5.6 / gpt-6 families default to Responses Lite. Select the full lane to allow
# parallel tools for models/accounts that support it. Explicit client restrictions
# on parallel tools still apply. Hosted automatic search uses the full search lane.
[models."gpt-6.1-sol"]
responses_lite = false

# Register a model served by your Antigravity account and route it independently.
# Canonical IDs/availability differ from the first-party Anthropic API; these are
# upstream reference examples, not a guarantee that your account can use them.
# [models."claude-sonnet-4-6"]
# provider = "agy"
# [models."claude-opus-4-6-thinking"]
# provider = "agy"
# [models."gemini-3.8-flash-tiered"]
# provider = "agy"

# Register an additional account-supported model without changing source:
# [models."another-model-id"]
# responses_lite = false
# search_model = "another-model-with-search"
